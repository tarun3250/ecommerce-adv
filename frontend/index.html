<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperTiles Ecommerce</title>
    <meta name="description" content="Discover the best tiles for your home.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Razorpay Checkput SDK for simulated flow -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">SuperTiles</h1>
            <ul class="nav-links">
                <li><a href="#" id="nav-home">Home</a></li>
                <li id="nav-orders-item" class="hidden"><a href="#" id="nav-orders">My Orders</a></li>
                <li id="nav-admin-item" class="hidden"><a href="#" id="nav-admin">Seller Dashboard</a></li>
                <li><a href="#" id="nav-cart" class="cart-link">Cart <span id="cart-count">0</span></a></li>
                <li id="nav-login-item"><a href="#" id="nav-login">Login / Register</a></li>
                <li id="nav-user-item" class="hidden"><span id="nav-username"></span> | <a href="#" id="nav-logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div id="app-container">
        <!-- Views will be dynamically injected here -->
    </div>

    <!-- Modals -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content glass">
            <span class="close-modal" onclick="closeModal('auth-modal')">&times;</span>
            <div class="tabs">
                <button id="tab-login" class="active">Login</button>
                <button id="tab-register">Register</button>
            </div>
            
            <form id="login-form">
                <h2>Welcome Back</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn primary">Login</button>
            </form>

            <form id="register-form" class="hidden">
                <h2>Create Account</h2>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="text" id="reg-mobile" placeholder="Mobile Number" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <select id="reg-role">
                    <option value="USER">Customer</option>
                    <option value="SELLER">Seller</option>
                </select>
                <button type="submit" class="btn primary">Register</button>
            </form>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Product Modal for Sellers -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-content glass">
            <span class="close-modal" onclick="closeModal('product-modal')">&times;</span>
            <h2 id="product-modal-title">Create Product</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <input type="text" id="prod-name" placeholder="Product Name" required>
                <input type="text" id="prod-brand" placeholder="Brand">
                <input type="text" id="prod-size" placeholder="Size (e.g. 60x60)">
                <textarea id="prod-desc" placeholder="Description" rows="3"></textarea>
                <div style="display:flex; gap:1rem;">
                    <input type="number" id="prod-price" placeholder="Price (₹)" required min="0" step="0.01">
                    <input type="number" id="prod-stock" placeholder="Stock Quantity" required min="0">
                </div>
                <button type="submit" class="btn primary" style="margin-top:1rem; width:100%;">Save Product</button>
            </form>
            <div id="product-error" class="error-msg"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
