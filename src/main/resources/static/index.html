<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity | Premium E-commerce</title>
    <meta name="description" content="Discover the best tiles for your home.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo" id="nav-logo">Gravity.</h1>
            <ul class="nav-links">
                <li><a href="#" id="nav-home" class="active">Discover</a></li>
                <li id="nav-orders-item" class="hidden"><a href="#" id="nav-orders">My Orders</a></li>
                <li id="nav-admin-item" class="hidden"><a href="#" id="nav-admin"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            </ul>
            <div class="nav-actions">
                <div class="nav-user" id="nav-user-item" class="hidden">
                    <span id="nav-username"></span>
                    <a href="#" id="nav-logout" title="Logout"><i class="fas fa-sign-out-alt"></i></a>
                </div>
                <button class="btn btn-outline" id="nav-login-item">Sign In</button>
                <button class="cart-btn" id="nav-cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div id="app-container">
        <!-- Views injected here -->
    </div>

    <!-- Cart Drawer -->
    <div class="cart-overlay hidden" id="cart-drawer-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Bag</h2>
            <button class="close-btn" id="close-cart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Cart items go here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cart-total-price">₹0.00</span>
            </div>
            <button class="btn btn-primary w-100" id="btn-checkout">Checkout Securely <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- Modals -->
    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal('auth-modal')"></div>
        <div class="modal-content glass-panel">
            <button class="close-modal" onclick="closeModal('auth-modal')"><i class="fas fa-times"></i></button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Sign In</button>
                <button class="auth-tab" data-tab="register">Create Account</button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-glow">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="reg-mobile" placeholder="+91 9876543210" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Account Type</label>
                    <div class="input-icon">
                        <i class="fas fa-users-cog"></i>
                        <select id="reg-role">
                            <option value="USER">Customer (Buying)</option>
                            <option value="SELLER">Seller (Selling)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-glow">Create Account</button>
            </form>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal('product-modal')"></div>
        <div class="modal-content glass-panel" style="max-width: 500px;">
            <button class="close-modal" onclick="closeModal('product-modal')"><i class="fas fa-times"></i></button>
            <h2 id="product-modal-title" style="margin-bottom: 1.5rem;">Create Product</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" placeholder="e.g. Gravity Smartwatch Pro" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Brand</label>
                        <input type="text" id="prod-brand" placeholder="e.g. Italica">
                    </div>
                    <div class="form-group">
                        <label>Size</label>
                        <input type="text" id="prod-size" placeholder="e.g. Space Grey / M">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" placeholder="Product details..." rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₹)</label>
                        <input type="number" id="prod-price" placeholder="0.00" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="prod-stock" placeholder="0" required min="0">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-glow" style="margin-top: 1rem;">Save Product</button>
            </form>
            <div id="product-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
