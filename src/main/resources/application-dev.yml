spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_dev}
    secret: ${RAZORPAY_KEY_SECRET:rzp_secret_dev}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    com.supertiles.ecommerce: DEBUG
